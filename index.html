        <h1>Wrestle Chess - 押し出しチェス</h1>
        <p>六角形ボードで相手のコマを押し出す戦略ゲームです。</p>

        <h2>ゲーム概要</h2>
        <p>Wrestle Chess（レッスルチェス）は、六角形のボード上で駒を動かし、相手の駒を盤外に押し出す戦略ゲームです。シンプルなルールながら奥深い戦略性があり、誰でも手軽に楽しめます。</p>

        <h2>特徴</h2>
        <ul>
          <li>六角形ボード - 従来のチェスとは異なる6方向への移動が可能</li>
          <li>押し出しルール - 相手の駒を押して盤外に落とすことで勝利</li>
          <li>複数選択 - 複数の駒を同時に選択して連携プレイが可能</li>
          <li>2つのゲームモード - 「押し出し」と「整列」の2種類のルール</li>
        </ul>

        <h2>プレイモード</h2>
        <ul>
          <li>ローカル対戦 - 1台の端末で2人対戦</li>
          <li>CPU対戦 - 4段階の難易度から選べるAIと対戦</li>
          <li>オンライン対戦 - 友達とリアルタイムで対戦</li>
        </ul>

        <h2>遊び方</h2>
        <p>黒と白のプレイヤーが交互に駒を動かします。自分のターンでは、自分の色の駒を選択して移動させます。相手の駒を押すには、自分の駒の数が相手より多い必要があります。</p>

        <p>このゲームを遊ぶにはJavaScriptを有効にしてください。</p>
